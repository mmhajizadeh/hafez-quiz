            options: ["صوفی ابن‌الوقت باشد ای رفیق / نیست فردا گفتن از شرط طریقت", "صوفی از پرتو می راز نهانی دانست / گوهر هر کس از این لعل توانی دانست", "صوفی نهاد دام و سر حقه باز کرد / بنیاد مکر با فلک حقه‌باز کرد", "هر دو مورد ۲ و ۳"],
            answer: 3
        },
        {
            q: "معنی ترکیب «مِیِ دو ساله» و «محبوب چهارده ساله» در اشعار حافظ بنا بر تفسیر عرفانی چیست؟",
            options: ["شراب معرفت بالغ و معشوق با کمالات کامل", "سن واقعی شراب و انسان", "سفر دو ساله و چهارده ساله", "تفسیر دو جلد و چهارده جلد کتاب"],
            answer: 0
        },
        {
            q: "در بیت «چو بشنوی سخن اهل دل مگو که خطاست / سخن‌شناس نیی جان من خطا این جاست»، آرایه اصلی چیست؟",
            options: ["حس‌آمیزی و نصیحت مستقیم", "ایهام تناسب", "جناس تام", "تضمین از سعدی"],
            answer: 0
        },
        {
            q: "معنی واژه «غالیه‌ساب» در اشعار حافظ چیست؟",
            options: ["ساینده و سازنده عطر و ماده خوشبو (غالیه)", "فروشنده پارچه‌های گران", "کسی که غلو و مبالغه می‌کند", "رنگ‌کننده پارچه‌ها"],
            answer: 0
        },
        {
            q: "در بیت «شاه شجاع چشم روشنایی بخش شیراز است»، لقب «چشم روشنایی بخش» کنایه از چیست؟",
            options: ["مایه روشنی، امنیت و شکوفایی شهر شیراز", "بینایی قوی شاه شجاع", "چراغ‌های کاخ شاهی", "عینک و لنز زیباشناختی"],
            answer: 0
        },
        {
            q: "کدام بیت به ماجرای تاریخی تعطیلی میکده‌ها به دستور امیر مبارزالدین (محتسب) اشاره دارد؟",
            options: ["اگر ز کوی تو بویی به من رساند باد / به مژده جان به صبا دادمی نه دامن یاد", "دوش دیدم که ملایک در میکده زدند / گل آدم بشتند و به پیمانه زدند", "بود آیا که در میکده‌ها بگشایند / گره از کار فروپسته ما بگشایند", "ای پادشه خوبان داد از غم تنهایی"],
            answer: 2
        },
        {
            q: "معنی واژه «نافه» در بیت «زین خوشتر از برای دل ای صبا بگو / نافه نافه ز زلفش چه می‌آوری» چیست؟",
            options: ["ماده بسیار خوشبو از آهوی ختن", "حلقه زلف", "مروارید گرانبها", "نامه عاشقانه"],
            answer: 0
        },
        {
            q: "در بیت «مطلب طاعت و پیمان و صلاح از من مست / که به پیمانه‌کشی شهره شدم روز الست»، «روز الست» کنایه از چیست؟",
            options: ["روز نخست آفرینش انسان و پیمان فطری الهی", "روز آخرت و قیامت", "روز عید نوروز", "روز تاج‌گذاری پادشاه"],
            answer: 0
        },
        {
            q: "معنی واژه «مُغْبَچِه» در اشعار حافظ چیست؟",
            options: ["پسر جوان خادم در میکده/دیر مغان", "فرزند پادشاه ساسانی", "کودک زرتشتی", "سرباز خردسال"],
            answer: 0
        },
        {
            q: "در بیت «حدیث از مطرب و می گو و راز دهر کمتر جو / که کس نگشود و نگشاید به حکمت این معمّا را»، منظور از «این معما» چیست؟",
            options: ["اسرار خلقت و راز آفرینش جهان", "معمای ریاضی و هندسی", "شناخت شخصیت پادشاه", "کشف داروهای پزشکی"],
            answer: 0
        },
        {
            q: "کدام غزل‌سرای معاصر، بیشترین پیروی را در ساختار و غزل‌سرایی حافظانه از خود نشان داده است؟",
            options: ["استاد شهریار", "سهراب سپهری", "مهدی اخوان ثالث", "احمد شاملو"],
            answer: 0
        }
    ];

    originalQuestions.push(...hardQuestions);

    let questions = [];
    let currentQuestionIndex = 0;
    let lives = 2;
    let score = 0;
    let timer;
    let timeLeft = 15;
    let userData = { name: "", phone: "" };
    let isAnsweringBlocked = false;

    const googleScriptURL = "https://script.google.com/macros/s/AKfycbz9Y2-sLjlOMqm0JnDMsiWrvVHz9fwd0HHVc_NpcTyRafJMGQOHgkgmrHpKSvKd3K5-0Q/exec";

    // تابع برای بر زدن و تصادفی کردن لیست سوالات (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startQuiz() {
        const nameInput = document.getElementById("name").value.trim();
        const phoneInput = document.getElementById("phone").value.trim();

        if(!nameInput) {
            alert("لطفاً نام و نام خانوادگی خود را وارد کنید.");
            return;
        }

        userData.name = nameInput;
        userData.phone = phoneInput || "ثبت نشده";

        // تصادفی‌سازی سوالات برای هر کاربر
        questions = shuffleArray(originalQuestions);

        document.getElementById("register-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length || lives <= 0) {
            endQuiz();
            return;
        }

        isAnsweringBlocked = false;
        clearInterval(timer);
        timeLeft = 15;
        document.getElementById("timer-progress").style.width = "100%";
        startTimer();

        const q = questions[currentQuestionIndex];
        document.getElementById("question-number").innerText = `سوال ${currentQuestionIndex + 1} از ${questions.length}`;
        document.getElementById("lives").innerText = `جان باقی‌مانده: ${'❤️'.repeat(lives)}`;
        document.getElementById("question-text").innerText = q.q;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function startTimer() {
        const progressBar = document.getElementById("timer-progress");
        timer = setInterval(() => {
            timeLeft--;
            let percentage = (timeLeft / 15) * 100;
            progressBar.style.width = percentage + "%";

            if (timeLeft <= 0) {
                clearInterval(timer);
                handleTimeOut();
            }
        }, 1000);
    }

    function checkAnswer(selectedIndex, selectedBtn) {
        if (isAnsweringBlocked) return;
        isAnsweringBlocked = true;
        clearInterval(timer);

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll("#options-container button");

        // غیرفعال کردن تمام دکمه‌ها
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.answer) {
            selectedBtn.classList.add("correct");
            score += 10;
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1000);
        } else {
            selectedBtn.classList.add("wrong");
            // نشان دادن گزینه صحیح جهت راهنمایی
            buttons[q.answer].classList.add("correct");
            lives--;
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1200);
        }
    }

    function handleTimeOut() {
        if (isAnsweringBlocked) return;
        isAnsweringBlocked = true;
        
        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll("#options-container button");
        buttons.forEach(btn => btn.disabled = true);
        
        // هایلایت گزینه درست به کاربر
        buttons[q.answer].classList.add("correct");
        lives--;

        setTimeout(() => {
            currentQuestionIndex++;
            loadQuestion();
        }, 1200);
    }

    function endQuiz() {
        clearInterval(timer);
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        
        document.getElementById("result-message").innerHTML = `
            کاربر عزیز: <b>${userData.name}</b><br>
            امتیاز شما: <b>${score}</b>
        `;

        if (googleScriptURL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
            fetch(googleScriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: userData.name,
                    phone: userData.phone,
                    score: score
                })
            }).catch(err => console.log(err));
        }
    }
</script>
